<!-- elements that are in x-axis are Rows -->
<!-- elements that are in y-axis are Columns -->

<!-- 
| Column 1 | Column 2 | Column 3 |
|----------|----------|----------|
| Row 1    |          |          |
| Row 2    |          |          |
| Row 3    |          |          |
 -->

<!-- 
**Rows** go left to right (horizontal).
**Columns** go top to bottom (vertical).

Think of a spreadsheet:
- Row 1: A1, B1, C1
- Column 1: A1, A2, A3

| Column 1 | Column 2 | Column 3 |
|----------|----------|----------|
| Row 1    | Row 1    | Row 1    |
| Row 2    | Row 2    | Row 2    |
| Row 3    | Row 3    | Row 3    | -->


<html>
    <head></head>
    <body>

        <table>
            <tr>
                <th>A</th>
                <th>B</th>
                <th>C</th>
            </tr>

            <tr>
                <td>A1</td>
                <td>B1</td>
                <td>C1</td>
            </tr>
            <tr>
                <td>A2</td>
                <td>B2</td>
                <td>C2</td>
            </tr>
            <tr>
                <td>A3</td>
                <td>B3</td>
                <td>C3</td>
            </tr>


        </table>

    </body>
</html>
